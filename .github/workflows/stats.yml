name: Generate GitHub Statistics

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create profile directory
        run: mkdir -p profile

      - name: Generate Stats Card
        run: |
          curl -fL "https://github-readme-stats.vercel.app/api?username=d-mestry06&show_icons=true&theme=tokyonight&hide_border=true" \
          -o profile/stats.svg

      - name: Generate Languages Card
        run: |
          curl -fL "https://github-readme-stats.vercel.app/api/top-langs/?username=d-mestry06&layout=compact&theme=tokyonight&hide_border=true" \
          -o profile/top-langs.svg

      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update GitHub statistics" || exit 0
          git push
